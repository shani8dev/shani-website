name: CI

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/ci.yml'
  workflow_dispatch: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    # A single-page marketing site with no build step — one tiny pip dep
    # for an offline-optional, standard-library-friendly verifier is
    # acceptable here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install html5lib
        run: python3 -m pip install --quiet html5lib

      - name: Validate index.html (html5lib strict parse, SRI, staleness)
        run: |
          # (1) html5lib strict parse — 0 parser errors. html5lib is
          # error-tolerant by design (it auto-corrects like a browser), so
          # non-empty HTMLParser.errors == malformed markup that a real
          # browser would silently mis-render.
          # NOTE: html5lib.parse() does NOT accept a `strict` kwarg on
          # html5lib 1.1 (TypeError) — the flag lives on the parser object.
          # (2) SRI — verify every <link>/<script> carrying integrity=.
          # shani-website ships one (Font Awesome cdnjs CSS); the check
          # fails if a tag is added without its hash or if a pinned hash
          # no longer matches the live CDN bytes.
          # (3) staleness — warn (non-fatal) if index.html's last commit
          # is older than STALE_DAYS so rot is surfaced, not silently kept.
          python3 - <<'PY'
          import base64, hashlib, os, re, subprocess, sys, urllib.request
          import html5lib

          STALE_DAYS = int(os.environ.get("STALE_DAYS", "90"))
          doc = open("index.html", encoding="utf-8").read()

          # (1) html5lib parse
          parser = html5lib.HTMLParser(strict=True)
          parser.parse(doc)
          errs = parser.errors
          if errs:
            print("::error::index.html has %d html5lib parse errors" % len(errs))
            for e in errs[:10]:
              print("  parse error:", e)
            sys.exit(1)
          print("html5lib parse: 0 errors")

          # (2) SRI verification
          tagged = re.findall(
            r'<(?:link|script)[^>]*?(?:src|href)='
            '"([^"]+)"[^>]*?integrity="([^"]+)"', doc, flags=re.IGNORECASE)
          if not tagged:
            print("SRI: no integrity= resources — nothing to verify")
          else:
            sri_fail = False
            for url, integrity in tagged:
              algo, _, pinned = integrity.partition("-")
              try:
                data = urllib.request.urlopen(url, timeout=20).read()
              except Exception as e:
                print("::warning::SRI fetch failed for %s: %r (verify manually)" % (url, e))
                continue
              dig = hashlib.new(algo, data).digest()
              computed = base64.b64encode(dig).decode()
              if computed != pinned:
                print("::error::SRI mismatch for %s" % url)
                sri_fail = True
              else:
                print("SRI match: %s (%s)" % (url, algo))
            if sri_fail:
              sys.exit(1)

          # (3) staleness warning (non-fatal)
          try:
            ts = subprocess.check_output(
              ["git", "log", "-1", "--format=%ct", "--", "index.html"],
            ).decode().strip()
            if ts:
              now = int(subprocess.check_output(["date", "+%s"]).decode().strip())
              age_days = (now - int(ts)) / 86400
              if age_days > STALE_DAYS:
                print("::warning::index.html last changed %.0f days ago (> %d) — content may be stale"
                      % (age_days, STALE_DAYS))
              else:
                print("staleness: index.html last changed %.0f days ago (within %d-day window)"
                      % (age_days, STALE_DAYS))
          except subprocess.CalledProcessError:
            print("::warning::cannot determine last commit date for index.html")
          print("All website checks passed.")
          PY

      - name: sitemap.xml well-formed
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('sitemap.xml OK')"

      # Version lockstep (roadmap #4): assets/js/script.js's VERSION constant
      # must match every hardcoded release string in index.html. The
      # script.js comment says "update VERSION and DATE" — the DATE is
      # derived from VERSION by convention, so VERSION is the single source
      # of truth, and index.html's download filenames / meta tags must track
      # it. A bump that misses index.html is exactly the silent drift this
      # check exists to catch.
      - name: Version lockstep (script.js VERSION vs index.html)
        run: |
          ver=$(grep -oE "const VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" assets/js/script.js | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          if [ -z "$ver" ]; then
            echo "::error::no VERSION constant found in assets/js/script.js"
            exit 1
          fi
          echo "script.js VERSION: $ver"
          # Every release string in index.html must equal $ver. Download
          # filenames and the JSON-LD softwareVersion are the canonical
          # places; anything else is a different (wrong) version.
          bad=$(grep -oE "[0-9]{4}\.[0-9]{2}\.[0-9]{2}" index.html | sort -u | grep -vxF "$ver")
          if [ -n "$bad" ]; then
            echo "::error::index.html has release strings not matching script.js VERSION ($ver):"
            echo "$bad"
            exit 1
          fi
          echo "OK: all release strings in index.html match script.js VERSION ($ver)"

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      scan-type: secrets